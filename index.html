<!doctype html><html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#080b10">
<title>Webbradio</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
.app{max-width:520px;margin:auto;min-height:100svh;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 18px)}
.head{text-align:center}.head b{letter-spacing:4px;font-size:17px}.clock{font-size:49px;font-weight:850;margin-top:5px}.date{color:#9aa5b3;font-size:14px;margin:2px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.preset{height:91px;border:1px solid #303846;border-radius:19px;color:white;padding:8px;overflow:hidden;background:#171c24}
.preset img{width:100%;height:61px;object-fit:contain;border-radius:11px}.preset span{display:block;font-size:13px;font-weight:750;margin-top:2px}
.fallback{font-size:21px;font-weight:900;line-height:1.05}.p1{background:#087f91}.p2{background:#d94a00}.p3{background:#087c54}.p4{background:#89136e}.rock{background:#191919}.bandit{background:#2a0b08}.dbk{background:#563212}.spotify{background:#0c2b1a}.active{outline:3px solid white}
.now{margin-top:13px;background:#121821;border:1px solid #29313d;border-radius:22px;padding:15px;display:grid;grid-template-columns:76px 1fr;gap:13px;align-items:center}
.art{width:76px;height:76px;border-radius:14px;object-fit:cover;background:#222}.station{font-size:22px;font-weight:850}.program{font-size:15px;margin-top:3px}.song{font-size:15px;font-weight:750;margin-top:6px;color:#dfe8f5}.meta{font-size:12px;color:#94a1b2;margin-top:4px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.controls button{height:58px;border:0;border-radius:18px;font-size:17px;font-weight:850}.play{background:#edf1f6;color:#111}.stop{background:#252c37;color:white}
.note{text-align:center;color:#657182;font-size:10px;margin:10px 6px}
</style></head><body><main class="app">
<div class="head"><b>WEBBRADIO</b><div id="clock" class="clock">--:--</div><div id="date" class="date"></div></div>
<div class="grid">
<button class="preset p1" data-name="P1" data-url="https://live1.sr.se/p1-mp3-96" data-srid="132" data-logo="https://static-cdn.sr.se/images/132/4a5e66b7-c935-415d-a524-c060ea227de2.jpg?preset=api-default-square"><img src="https://static-cdn.sr.se/images/132/4a5e66b7-c935-415d-a524-c060ea227de2.jpg?preset=api-default-square"><span>P1</span></button>
<button class="preset p2" data-name="P2" data-url="https://live1.sr.se/p2-mp3-96" data-srid="163" data-logo="https://static-cdn.sr.se/images/163/684f7bac-3e2e-4a7a-969e-6892b70069d6.jpg?preset=api-default-square"><img src="https://static-cdn.sr.se/images/163/684f7bac-3e2e-4a7a-969e-6892b70069d6.jpg?preset=api-default-square"><span>P2</span></button>
<button class="preset p3" data-name="P3" data-url="https://live1.sr.se/p3-mp3-96" data-srid="164" data-logo="https://static-cdn.sr.se/images/164/1adb95c9-cc4e-452f-b1ed-0602b3e15c46.jpg?preset=api-default-square"><img src="https://static-cdn.sr.se/images/164/1adb95c9-cc4e-452f-b1ed-0602b3e15c46.jpg?preset=api-default-square"><span>P3</span></button>
<button class="preset p4" data-name="P4 Sjuhärad" data-url="https://live1.sr.se/p4sju-mp3-96" data-srid="206" data-logo="https://static-cdn.sr.se/images/206/44d3f4f5-66a7-4afb-bc58-0cb3caa79e61.jpg?preset=api-default-square"><img src="https://static-cdn.sr.se/images/206/44d3f4f5-66a7-4afb-bc58-0cb3caa79e61.jpg?preset=api-default-square"><span>P4 Sjuhärad</span></button>
<button class="preset rock" data-name="Rockklassiker" data-url="https://live-bauerse-fm.sharp-stream.com/rockklassiker_instream_se_aacp" data-logo="rockklassiker-logo.png"><img src="rockklassiker-logo.png" alt="Rockklassiker"><span>Rockklassiker</span></button>
<button class="preset bandit" data-name="Bandit Rock" data-url="https://fm02-ice.stream.khz.se/fm02_mp3" data-logo="bandit-logo.png"><img src="bandit-logo.png" alt="Bandit Rock"><span>Bandit Rock</span></button>
<button class="preset dbk" data-name="Dansbandskanalen" data-url="https://stream.dbmedia.se/dbkMP3" data-logo="dansbandskanalen-logo.png"><img src="dansbandskanalen-logo.png" alt="Dansbandskanalen"><span>Dansbandskanalen</span></button>
<button class="preset spotify" id="spotify"><div class="fallback">● Spotify</div><span>Öppna Spotify</span></button>
</div>
<section class="now"><img id="art" class="art" alt=""><div><div id="station" class="station">Välj station</div><div id="program" class="program">Redo</div><div id="song" class="song"></div><div id="meta" class="meta"></div></div></section>
<div class="controls"><button id="pp" class="play">▶ Spela</button><button id="stop" class="stop">■ Stoppa</button></div>
<div class="note">SR: program + aktuell låt när metadata finns. Uppdateras var 30:e sekund.</div>
<audio id="audio" playsinline preload="none"></audio>
<script>
const a=document.getElementById('audio'), station=document.getElementById('station'), program=document.getElementById('program'), song=document.getElementById('song'), meta=document.getElementById('meta'), art=document.getElementById('art'), pp=document.getElementById('pp');
let cur=null;
function tick(){let d=new Date();clock.textContent=d.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});date.textContent=d.toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'})}tick();setInterval(tick,1000);
function srDate(v){if(!v)return null;let m=/\/Date\((\d+)/.exec(v);return m?new Date(+m[1]):new Date(v)}
async function updateMeta(){
 if(!cur)return;
 if(cur.dataset.srid){
   try{
    const [rs,rp]=await Promise.all([
      fetch(`https://api.sr.se/api/v2/scheduledepisodes/rightnow?channelid=${cur.dataset.srid}&format=json`).then(r=>r.json()),
      fetch(`https://api.sr.se/api/v2/playlists/rightnow?channelid=${cur.dataset.srid}&format=json`).then(r=>r.json()).catch(()=>null)
    ]);
    let c=rs.channel&&rs.channel.currentscheduledepisode;
    if(c){program.textContent=c.title||c.program?.name||'Direktsändning';let s=srDate(c.starttimeutc),e=srDate(c.endtimeutc);meta.textContent=s&&e?`${s.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})}–${e.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})}`:'Direktsändning'}
    let x=rp&&rp.playlist&&rp.playlist.song;
    song.textContent=x?(x.artist?`${x.artist} – ${x.title}`:x.title||''):'';
   }catch(e){meta.textContent='Metadata kunde inte hämtas just nu'}
 } else {
   program.textContent='● Live';
   song.textContent='Låtinformation stöds inte säkert för denna station ännu';
   meta.textContent='';
 }
}
document.querySelectorAll('.preset[data-url]').forEach(b=>b.onclick=async()=>{
 document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));b.classList.add('active');cur=b;station.textContent=b.dataset.name;art.src=b.dataset.logo||'';program.textContent='Ansluter…';song.textContent='';meta.textContent='';
 a.src=b.dataset.url;try{await a.play();pp.textContent='⏸ Pausa';updateMeta()}catch(e){program.textContent='Kunde inte starta strömmen'}
});
pp.onclick=async()=>{if(!cur)return;if(a.paused){try{await a.play();pp.textContent='⏸ Pausa'}catch(e){}}else{a.pause();pp.textContent='▶ Spela'}};
stop.onclick=()=>{a.pause();a.removeAttribute('src');a.load();pp.textContent='▶ Spela';program.textContent='Stoppad'};
spotify.onclick=()=>{a.pause();location.href='spotify://';setTimeout(()=>location.href='https://open.spotify.com/',800)};
setInterval(updateMeta,30000);
</script></main></body></html>
