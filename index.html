<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Webbradio">
<meta name="theme-color" content="#090b10">
<title>Webbradio</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body { margin:0; min-height:100%; background:#090b10; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif; }
body { min-height:100svh; display:flex; justify-content:center; }
.app { width:100%; max-width:520px; min-height:100svh; padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 20px); display:flex; flex-direction:column; gap:16px; }
.top { text-align:center; }
.clock { font-size:54px; font-weight:700; letter-spacing:-2px; line-height:1; }
.date { margin-top:6px; color:#9ca3af; font-size:15px; }
.now { background:#151922; border:1px solid #272d39; border-radius:24px; padding:18px; text-align:center; box-shadow:0 12px 35px rgba(0,0,0,.25); }
.label { color:#9ca3af; text-transform:uppercase; letter-spacing:1.5px; font-size:11px; font-weight:700; }
.station { font-size:27px; font-weight:800; margin-top:5px; }
.status { margin-top:5px; color:#a7f3d0; font-size:14px; min-height:18px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
button { border:0; color:#fff; font:inherit; cursor:pointer; }
.preset { min-height:78px; border-radius:20px; background:#181d27; border:1px solid #2a303d; font-size:20px; font-weight:750; padding:10px; }
.preset:active { transform:scale(.98); }
.preset.active { outline:2px solid #fff; background:#242b38; }
.dbk { grid-column:1 / -1; background:#372214; }
.spotify { grid-column:1 / -1; background:#12321f; }
.controls { margin-top:auto; display:grid; grid-template-columns:1fr 1fr; gap:11px; }
.control { min-height:64px; border-radius:20px; background:#f3f4f6; color:#111827; font-size:18px; font-weight:800; }
.stop { background:#242a35; color:#fff; border:1px solid #353c49; }
.hint { text-align:center; color:#737b8a; font-size:12px; line-height:1.35; padding:0 10px; }
</style>
</head>
<body>
<main class="app">
  <section class="top">
    <div id="clock" class="clock">--:--</div>
    <div id="date" class="date"></div>
  </section>

  <section class="now">
    <div class="label">Spelar nu</div>
    <div id="station" class="station">Välj station</div>
    <div id="status" class="status">Redo</div>
  </section>

  <section class="grid" id="stations">
    <button type="button" class="preset" data-name="P1" data-url="https://live1.sr.se/p1-aac-128">P1</button>
    <button type="button" class="preset" data-name="P2" data-url="https://live1.sr.se/p2-aac-128">P2</button>
    <button type="button" class="preset" data-name="P3" data-url="https://live1.sr.se/p3-aac-128">P3</button>
    <button type="button" class="preset" data-name="P4 Stockholm" data-url="https://live1.sr.se/p4stockholm-aac-128">P4</button>
    <button type="button" class="preset" data-name="Rockklassiker" data-url="https://live-bauerse-fm.sharp-stream.com/rockklassiker_instream_se_aacp">Rockklassiker</button>
    <button type="button" class="preset" data-name="Bandit Rock" data-url="https://fm02-ice.stream.khz.se/fm02_mp3">Bandit</button>
    <button class="preset dbk" data-name="Dansbandskanalen" data-url="https://stream.dbmedia.se/dbkMP3">Dansbandskanalen</button>
    <button type="button" class="preset spotify" id="spotify">Spotify</button>
  </section>

  <section class="controls">
    <button type="button" class="control" id="playpause">▶ Spela</button>
    <button class="control stop" id="stop">■ Stoppa</button>
  </section>

  <div class="hint">Volymen styrs med iPhones volymknappar. Första uppspelningen måste startas med ett tryck på en station, enligt iOS regler.</div>
  <audio id="audio" preload="none" playsinline></audio>
</main>

<script>
const audio = document.getElementById('audio');
const stationEl = document.getElementById('station');
const statusEl = document.getElementById('status');
const pp = document.getElementById('playpause');
const buttons = [...document.querySelectorAll('.preset[data-url]')];
let current = null;

function tick(){
  const d = new Date();
  document.getElementById('clock').textContent =
    d.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('date').textContent =
    d.toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'});
}
tick(); setInterval(tick,1000);

async function playStation(btn){
  buttons.forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  current = btn;
  stationEl.textContent = btn.dataset.name;
  statusEl.textContent = 'Ansluter…';
  audio.src = btn.dataset.url;
  try {
    await audio.play();
    statusEl.textContent = '● Live';
    pp.textContent = '⏸ Pausa';
  } catch(e) {
    statusEl.textContent = 'Tryck igen för att starta';
    pp.textContent = '▶ Spela';
  }
}
buttons.forEach(btn=>btn.addEventListener('click',()=>playStation(btn)));

pp.addEventListener('click', async ()=>{
  if(!current){ statusEl.textContent='Välj en station först'; return; }
  if(audio.paused){
    try { await audio.play(); statusEl.textContent='● Live'; pp.textContent='⏸ Pausa'; }
    catch(e){ statusEl.textContent='Kunde inte starta strömmen'; }
  } else {
    audio.pause(); statusEl.textContent='Pausad'; pp.textContent='▶ Spela';
  }
});
document.getElementById('stop').addEventListener('click',()=>{
  audio.pause(); audio.removeAttribute('src'); audio.load();
  buttons.forEach(b=>b.classList.remove('active'));
  current=null; stationEl.textContent='Välj station'; statusEl.textContent='Stoppad'; pp.textContent='▶ Spela';
});
document.getElementById('spotify').addEventListener('click',()=>{
  audio.pause(); pp.textContent='▶ Spela'; statusEl.textContent='Öppnar Spotify…';
  window.location.href='spotify://';
  setTimeout(()=>{ window.location.href='https://open.spotify.com/'; },900);
});
audio.addEventListener('waiting',()=>statusEl.textContent='Buffrar…');
audio.addEventListener('playing',()=>{statusEl.textContent='● Live';pp.textContent='⏸ Pausa';});
audio.addEventListener('error',()=>statusEl.textContent='Strömmen kunde inte spelas');
</script>
</body>
</html>
