<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#090b10"><title>Webbradio</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:white;font-family:-apple-system,sans-serif}.app{max-width:520px;margin:auto;padding:30px 16px}.clock{text-align:center;font-size:52px;font-weight:800}.now{text-align:center;background:#151922;padding:18px;border-radius:22px;margin:20px 0}.station{font-size:25px;font-weight:800}.status{color:#a7f3d0;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}button{min-height:76px;border:1px solid #303744;border-radius:20px;background:#181d27;color:white;font-size:19px;font-weight:750}.wide{grid-column:1/-1}.dbk{background:#372214}.spotify{background:#12321f}.controls{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}.controls button{background:#eee;color:#111}.controls .stop{background:#242a35;color:white}</style></head><body><main class="app"><div id="clock" class="clock">--:--</div><section class="now"><div id="station" class="station">Välj station</div><div id="status" class="status">Redo</div></section><section class="grid">
<button data-name="P1" data-url="https://live1.sr.se/p1-aac-128">P1</button>
<button data-name="P2" data-url="https://live1.sr.se/p2-aac-128">P2</button>
<button data-name="P3" data-url="https://live1.sr.se/p3-aac-128">P3</button>
<button data-name="P4 Sjuhärad" data-url="https://live1.sr.se/p4sjuharad-aac-128">P4 Sjuhärad</button>
<button data-name="Rockklassiker" data-url="https://live-bauerse-fm.sharp-stream.com/rockklassiker_instream_se_aacp">Rockklassiker</button>
<button data-name="Bandit Rock" data-url="https://fm02-ice.stream.khz.se/fm02_mp3">Bandit</button>
<button class="wide dbk" data-name="Dansbandskanalen" data-url="https://stream.dbmedia.se/dbkMP3">Dansbandskanalen</button>
<button class="wide spotify" id="spotify">Spotify</button></section>
<section class="controls"><button id="pp">▶ Spela</button><button class="stop" id="stop">■ Stoppa</button></section><audio id="audio" playsinline></audio></main>
<script>
const a=document.getElementById("audio"),st=document.getElementById("station"),status=document.getElementById("status"),pp=document.getElementById("pp");let cur=null;
function clock(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"})}clock();setInterval(clock,1000);
document.querySelectorAll("button[data-url]").forEach(b=>b.onclick=async()=>{cur=b;st.textContent=b.dataset.name;status.textContent="Ansluter…";a.src=b.dataset.url;try{await a.play();status.textContent="● Live";pp.textContent="⏸ Pausa"}catch(e){status.textContent="Kunde inte starta strömmen"}});
pp.onclick=async()=>{if(!cur)return;if(a.paused){try{await a.play();pp.textContent="⏸ Pausa";status.textContent="● Live"}catch(e){}}else{a.pause();pp.textContent="▶ Spela";status.textContent="Pausad"}};
document.getElementById("stop").onclick=()=>{a.pause();a.removeAttribute("src");a.load();cur=null;st.textContent="Välj station";status.textContent="Stoppad";pp.textContent="▶ Spela"};
document.getElementById("spotify").onclick=()=>{a.pause();location.href="spotify://";setTimeout(()=>location.href="https://open.spotify.com/",900)};
</script></body></html>
