<title>Webbradio</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
.app{max-width:520px;margin:auto;min-height:100svh;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 18px)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.preset{position:relative;height:105px;border:1px solid #303846;border-radius:19px;color:white;padding:0;overflow:hidden;background:#171c24}

<style>
/* 3D radio-panel style matching the approved mockup */
body{
  background:
    radial-gradient(circle at 50% -10%,#263345 0,#101720 34%,#070a0f 72%);
}
.grid{gap:14px 13px}
.preset{
  height:112px;
  border-radius:23px;
  border:2px solid #667180;
  background:#10151d;
  box-shadow:
    0 9px 10px rgba(0,0,0,.72),
    0 3px 0 #020305,
    inset 0 2px 2px rgba(255,255,255,.9),
    inset 0 -8px 14px rgba(0,0,0,.52);
  transform:translateY(0);
  transition:transform .08s ease,box-shadow .08s ease,filter .08s ease;
}
.preset::before{
  content:"";
  position:absolute;
  inset:2px;
  z-index:3;
  pointer-events:none;
  border-radius:19px;
  background:linear-gradient(145deg,
    rgba(255,255,255,.48) 0%,
    rgba(255,255,255,.10) 13%,
    rgba(255,255,255,0) 34%,
    rgba(255,255,255,0) 72%,
    rgba(255,255,255,.10) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.18),
    inset 0 7px 9px rgba(255,255,255,.09);
}
.preset::after{
  content:"";
  position:absolute;
  z-index:4;
  left:8%;right:8%;top:4px;height:3px;
  border-radius:50%;
  background:rgba(255,255,255,.78);
  filter:blur(.5px);
  pointer-events:none;
}
.preset img{
  z-index:1;
  border-radius:20px;
}
.preset:active{
  transform:translateY(5px) scale(.985);
  box-shadow:
    0 3px 4px rgba(0,0,0,.75),
    inset 0 3px 8px rgba(0,0,0,.45);
  filter:brightness(.88);
}
.preset.active{
  outline:2px solid rgba(80,180,255,.95);
  outline-offset:2px;
  box-shadow:
    0 0 14px rgba(0,153,255,.85),
    0 9px 10px rgba(0,0,0,.7),
    inset 0 2px 2px rgba(255,255,255,.85),
    inset 0 -8px 14px rgba(0,0,0,.48);
}
.now{
  margin-top:20px;
  border-radius:25px;
  border:1px solid #738091;
  background:linear-gradient(145deg,#1b2532,#0c1118 68%);
  box-shadow:
    0 12px 18px rgba(0,0,0,.6),
    inset 0 1px 1px rgba(255,255,255,.28),
    inset 0 -8px 18px rgba(0,0,0,.4);
}
.art{
  border:1px solid #667789;
  box-shadow:
    0 7px 10px rgba(0,0,0,.65),
    inset 0 1px 1px rgba(255,255,255,.45);
}
.controls button{
  border:1px solid #66717f;
  box-shadow:
    0 7px 9px rgba(0,0,0,.58),
    inset 0 2px 2px rgba(255,255,255,.38),
    inset 0 -5px 8px rgba(0,0,0,.28);
}
.controls button:active{
  transform:translateY(3px);
  box-shadow:0 2px 3px rgba(0,0,0,.7),inset 0 3px 7px rgba(0,0,0,.35);
}
.play{
  background:linear-gradient(#168cff,#0067e9)!important;
  color:#fff!important;
  text-shadow:0 1px 2px #003f8e;
}
</style>

</head><body><main class="app">
<div class="head"><b>WEBBRADIO</b><div id="clock" class="clock">--:--</div><div id="date" class="date"></div></div>
<div class="grid">
<button class="preset p1" data-name="P1" data-url="https://live1.sr.se/p1-mp3-96" data-srid="132" data-logo="p1-button.png"><img src="p1-button.png" alt=""></button>
<button class="preset p2" data-name="P2" data-url="https://live1.sr.se/p2-mp3-96" data-srid="163" data-logo="p2-button.png"><img src="p2-button.png" alt=""></button>
<button class="preset p3" data-name="P3" data-url="https://live1.sr.se/p3-mp3-96" data-srid="164" data-logo="p3-button.png"><img src="p3-button.png" alt=""></button>
<button class="preset p4" data-name="P4 Sjuhärad" data-url="https://live1.sr.se/p4sju-mp3-96" data-srid="206" data-logo="p4-sjuharad-button.png"><img src="p4-sjuharad-button.png" alt=""></button>
<button class="preset rock" data-name="Rockklassiker" data-url="https://live-bauerse-fm.sharp-stream.com/rockklassiker_instream_se_aacp" data-logo="rockklassiker-button.png"><img src="rockklassiker-button.png" alt=""></button>
<button class="preset bandit" data-name="Bandit Rock" data-url="https://fm02-ice.stream.khz.se/fm02_mp3" data-logo="bandit-button.png"><img src="bandit-button.png" alt=""></button>
<button class="preset dbk" data-name="Dansbandskanalen" data-url="https://stream.dbmedia.se/dbkMP3" data-logo="dansbandskanalen-button.png"><img src="dansbandskanalen-button.png" alt=""></button>
<button class="preset spotify" id="spotify" data-logo="spotify-button.png"><img src="spotify-button.png" alt="Spotify"></button>
</div>
<section class="now"><img id="art" class="art" alt=""><div><div id="station" class="station">Välj station</div><div id="program" class="program">Redo</div><div id="song" class="song"></div><div id="meta" class="meta"></div></div></section>
<div class="controls"><button id="pp" class="play">▶ Spela</button><button id="stop" class="stop">■ Stoppa</button></div>
<div class="note">SR: program + aktuell låt när metadata finns. Uppdateras var 30:e sekund.</div>
<audio id="audio" playsinline preload="none"></audio>
<script>
const a=document.getElementById('audio'), station=document.getElementById('station'), program=document.getElementById('program'), song=document.getElementById('song'), meta=document.getElementById('meta'), art=document.getElementById('art'), pp=document.getElementById('pp');
let cur=null;
function tick(){let d=new Date();clock.textContent=d.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});date.textContent=d.toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'})}tick();setInterval(tick,1000);
function srDate(v){if(!v)return null;let m=/\/Date\((\d+)/.exec(v);return m?new Date(+m[1]):new Date(v)}
async function updateMeta(){
 if(!cur)return;
 if(cur.dataset.srid){
   try{
    const [rs,rp]=await Promise.all([
      fetch(`https://api.sr.se/api/v2/scheduledepisodes/rightnow?channelid=${cur.dataset.srid}&format=json`).then(r=>r.json()),
      fetch(`https://api.sr.se/api/v2/playlists/rightnow?channelid=${cur.dataset.srid}&format=json`).then(r=>r.json()).catch(()=>null)
    ]);
    let c=rs.channel&&rs.channel.currentscheduledepisode;
    if(c){program.textContent=c.title||c.program?.name||'Direktsändning';let s=srDate(c.starttimeutc),e=srDate(c.endtimeutc);meta.textContent=s&&e?`${s.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})}–${e.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})}`:'Direktsändning'}
    let x=rp&&rp.playlist&&rp.playlist.song;
    song.textContent=x?(x.artist?`${x.artist} – ${x.title}`:x.title||''):'';
   }catch(e){meta.textContent='Metadata kunde inte hämtas just nu'}
 } else {
   program.textContent='● Live';
   song.textContent='Låtinformation stöds inte säkert för denna station ännu';
   meta.textContent='';
 }
}
document.querySelectorAll('.preset[data-url]').forEach(b=>b.onclick=async()=>{
 document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));b.classList.add('active');cur=b;station.textContent=b.dataset.name;art.src=b.dataset.logo||'';program.textContent='Ansluter…';song.textContent='';meta.textContent='';
 a.src=b.dataset.url;try{await a.play();pp.textContent='⏸ Pausa';updateMeta()}catch(e){program.textContent='Kunde inte starta strömmen'}
});
pp.onclick=async()=>{if(!cur)return;if(a.paused){try{await a.play();pp.textContent='⏸ Pausa'}catch(e){}}else{a.pause();pp.textContent='▶ Spela'}};
stop.onclick=()=>{a.pause();a.removeAttribute('src');a.load();pp.textContent='▶ Spela';program.textContent='Stoppad'};
spotify.onclick=()=>{a.pause();location.href='spotify://';setTimeout(()=>location.href='https://open.spotify.com/',800)};
setInterval(updateMeta,30000);
</script></main></body></html>
